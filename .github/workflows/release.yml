name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.1)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - run: python -m unittest discover -s tests -v
      - name: Publish standalone installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/install.ps1 dist/install.sh dist/SHA256SUMS --verify-tag --generate-notes --title "stm32-rtt-installer $RELEASE_TAG"
